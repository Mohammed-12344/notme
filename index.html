    // إذا كان من روبلوكس، قم بتشغيل السكربت مباشرة

        .then(response => response.text())
        .then(data => {

        });
} else {
    // إذا كان من متصفح، أظهر رسالة الحماية
    document.write("<h1 style='color:red;'>REX-M HUB</h1><p>ممنوع: هذا الرابط خاص بسكربت روبلوكس فقط!</p>");
}
</script>
